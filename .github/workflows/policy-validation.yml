name: FMC Policy Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv

      - name: Run Unit Tests
        run: |
          python -m pytest -v

      - name: Run FMC Policy Audit
        run: |
          cd src
          python policy_audit.py
        env:
          FMC_HOST: ${{ secrets.FMC_HOST }}
          FMC_USERNAME: ${{ secrets.FMC_USERNAME }}
          FMC_PASSWORD: ${{ secrets.FMC_PASSWORD }}

      - name: Upload Report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmc-policy-report
          path: fmc_policy_report.csv
