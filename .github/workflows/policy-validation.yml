name: Run FMC Policy Audit

on:
  workflow_dispatch:  

jobs:
  audit:
    runs-on: ubuntu-latest

    env:
      FMC_HOST: ${{ secrets.FMC_HOST }}
      FMC_USERNAME: ${{ secrets.FMC_USERNAME }}
      FMC_PASSWORD: ${{ secrets.FMC_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run FMC Policy Audit
        run: |
          cd src
          python policy_audit.py
